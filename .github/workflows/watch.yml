name: CGV IMAX Watch (baseline/burst)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: cgv-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run watcher (mode auto-detected: baseline or burst)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.main

      - name: Commit state changes
        run: |
          git config user.name "cgv-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          if ! git diff --cached --quiet; then
            git commit -m "chore: update watch snapshot [skip ci]"
            git push
          else
            echo "no state changes, skip commit"
          fi
