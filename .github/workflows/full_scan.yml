name: CGV IMAX Full Scan (1x/day)

on:
  schedule:
    - cron: "0 4 * * *" # UTC 04:00 = KST 13:00
  workflow_dispatch: {}

concurrency:
  group: cgv-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  full_scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run full scan (today ~ +35일 전체 순회, heartbeat 발송)
        env:
          MODE: full_scan
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.main

      - name: Commit state changes
        run: |
          git config user.name "cgv-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          if ! git diff --cached --quiet; then
            git commit -m "chore: full scan snapshot update [skip ci]"
            git push
          else
            echo "no state changes, skip commit"
          fi
